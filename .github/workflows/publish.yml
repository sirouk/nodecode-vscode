name: Publish extension

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # vsce 3.x wants Node 20+; pin 22 like prime-agent-vscode does.
          node-version: 22

      - name: Install dependencies
        # Deliberately npm install: this repo ships without a package-lock.json
        # because the workspace it grew from had none matching its needs.
        # Reintroduce a lock alongside a checked-in regeneration, then flip to ci.
        run: npm install

      - name: Verify build
        run: |
          npm run compile
          npm test

      - name: Verify icon is current
        run: |
          npm run icon
          git diff --exit-code -- media/icon.png

  publish:
    needs: verify
    if: github.event_name == 'release' && github.repository == 'sirouk/nodecode-vscode'
    runs-on: ubuntu-latest
    # VSCE_PAT is a repository-level secret (Settings -> Secrets and variables ->
    # Actions). No environment scoping: the job reads it directly.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Check the tag matches package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "Release tag $GITHUB_REF_NAME does not match package.json version $pkg" >&2
            exit 1
          fi
          echo "Publishing version $pkg"

      - name: Package the vsix
        run: |
          # vsce globs with dot:true and ignores .gitignore, so anything untracked
          # in the checkout ships. Assert the whole file set; keep this list in
          # step with the same allowlist in release.sh.
          unexpected="$(npx vsce ls --no-dependencies | grep -vE '^(package\.json|README\.md|LICENSE|CHANGELOG\.md|out/[^/]+\.js|media/icon\.png|media/icon\.svg)$' || true)"
          if [ -n "$unexpected" ]; then
            echo "refusing to package: unexpected files would ship inside the vsix:" >&2
            echo "$unexpected" >&2
            exit 1
          fi
          npm run package

      - name: Publish to the VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "VSCE_PAT resolved to empty — cannot publish." >&2
            echo "It must be a SECRET (not a variable) named VSCE_PAT, stored either in the" >&2
            echo "'CI' environment (Settings > Environments > CI > Add environment secret)" >&2
            echo "or at repo level (Settings > Secrets and variables > Actions)." >&2
            echo "Then re-run this workflow." >&2
            exit 1
          fi
          # Exact name, not `ls -t`: a second vsix left behind would otherwise win.
          vsix="nodecode-vscode-$(node -p "require('./package.json').version").vsix"
          [ -f "$vsix" ] || { echo "npm run package did not produce $vsix" >&2; exit 1; }
          npx vsce publish --packagePath "$vsix"

      - name: Attach the vsix to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          vsix="nodecode-vscode-$(node -p "require('./package.json').version").vsix"
          gh release upload "$GITHUB_REF_NAME" "$vsix" --clobber

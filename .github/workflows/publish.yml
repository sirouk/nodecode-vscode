name: Publish extension

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    # Verify the exact event commit, including every tag eligible for publishing.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # vsce 3.x wants Node 20+; pin 22 like prime-agent-vscode does.
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Verify build
        run: |
          npm run compile
          npm test

      - name: Verify icon is current
        run: |
          npm run icon
          git diff --exit-code -- media/icon.png

  publish:
    needs: verify
    if: github.ref_type == 'tag' && github.repository == 'sirouk/nodecode-vscode'
    runs-on: ubuntu-latest
    # VSCE_PAT is a repository-level secret (Settings -> Secrets and variables ->
    # Actions). No environment scoping: the job reads it directly.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Check the tag matches package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "Release tag $GITHUB_REF_NAME does not match package.json version $pkg" >&2
            exit 1
          fi
          node -e 'const p=require("./package.json"),l=require("./package-lock.json"); if (l.version!==p.version || l.packages[""].version!==p.version) { console.error("package-lock.json version does not match package.json"); process.exit(1); }'
          echo "Publishing version $pkg"

      - name: Package the vsix
        run: |
          # vsce globs with dot:true and ignores .gitignore, so anything untracked
          # in the checkout ships. Assert the whole file set; keep this list in
          # step with the same allowlist in release.sh.
          unexpected="$(npx vsce ls --no-dependencies | grep -vE '^(package\.json|README\.md|LICENSE|CHANGELOG\.md|out/[^/]+\.js|media/icon\.png|media/(icon|activity)\.svg)$' || true)"
          if [ -n "$unexpected" ]; then
            echo "refusing to package: unexpected files would ship inside the vsix:" >&2
            echo "$unexpected" >&2
            exit 1
          fi
          npm run package

      - name: Publish to the VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "VSCE_PAT resolved to empty — cannot publish." >&2
            echo "It must be a repo-level Actions SECRET (not a variable) named VSCE_PAT:" >&2
            echo "Settings > Secrets and variables > Actions > Repository secrets." >&2
            echo "Then re-run this failed run." >&2
            exit 1
          fi
          # Exact name, not `ls -t`: a second vsix left behind would otherwise win.
          vsix="nodecode-vscode-$(node -p "require('./package.json').version").vsix"
          [ -f "$vsix" ] || { echo "npm run package did not produce $vsix" >&2; exit 1; }
          npx vsce publish --packagePath "$vsix"

      - name: Create the GitHub release and attach the vsix
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          vsix="nodecode-vscode-$(node -p "require('./package.json').version").vsix"
          notes="$(node -e 'const c=require("fs").readFileSync("CHANGELOG.md","utf8"),v=require("./package.json").version;let i=c.indexOf("## ["+v+"]"),s=i>=0?c.slice(i):c,j=s.indexOf("\n## ");process.stdout.write((j>=0?s.slice(0,j):s).trim())')"
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 && exit 0
          gh release create "$GITHUB_REF_NAME" "$vsix" \
            --title "$GITHUB_REF_NAME" \
            --notes "$notes"
